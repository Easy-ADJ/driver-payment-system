spring.application.name=Eazy-adj

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eazy_adj}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

payment.kakao.cid=TC0ONETIME
payment.kakao.secret-key=${KAKAOPAY_SECRET_KEY}

payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:http://localhost:8080}